[package]
name = "hvir-agent"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

[dependencies]
socket2 = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
