<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skills in this project</title>
    <link rel="stylesheet" href="presentation.css" />
    <link rel="stylesheet" href="skillager.css" />
  </head>
  <body class="hvir-guest" data-view="project">
    <main>
      <header class="library-heading">
        <h1>Project skills</h1>
        <details class="skill-more library-options">
          <summary class="hvir-focus">Options</summary>
          <div class="skill-menu">
            <button id="browse" class="hvir-button">Browse all skills</button>
            <button id="refresh" class="hvir-button">Refresh skills</button>
            <button id="manage" class="hvir-button" disabled>Advanced management</button>
          </div>
        </details>
      </header>
      <button id="open-library" class="hvir-button">Your library</button>
      <div id="connection-controls" class="toolbar">
        <button
          id="connect-program"
          class="hvir-button"
          aria-describedby="connection-status"
          hidden
        >
          Connect Skillager
        </button>
        <span id="connection-status" class="hvir-meta" role="status" hidden></span>
      </div>
      <form id="search-form">
        <input
          id="query"
          class="hvir-input"
          type="search"
          aria-label="Search project skills"
          placeholder="Search skills"
        /><button class="hvir-button" type="submit">Search</button>
      </form>
      <details id="program-setup" hidden>
        <summary>Set up Skillager with your agent</summary>
        <p>
          Copy this request into your preferred agent. hvir does not install programs or
          send it to a terminal.
        </p>
        <textarea
          id="setup-request"
          class="hvir-input"
          rows="7"
          readonly
          aria-label="Copyable Skillager setup request"
        ></textarea>
      </details>
      <p id="state" class="hvir-state" aria-live="polite">Connecting…</p>
      <div
        id="skills"
        class="hvir-list"
        role="listbox"
        aria-label="Skill observations"
      ></div>
      <nav class="toolbar" aria-label="Skill pages">
        <button id="previous" class="hvir-button" disabled>Previous</button
        ><button id="next" class="hvir-button" disabled>Next</button>
      </nav>
      <details class="observation-details">
        <summary>Observation details</summary>
        <p id="observation-details" class="hvir-meta"></p>
      </details>
    </main>
    <script src="guest-ui.js"></script>
    <script src="skillager.js"></script>
  </body>
</html>
