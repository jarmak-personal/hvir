<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your library</title>
    <link rel="stylesheet" href="presentation.css" />
    <link rel="stylesheet" href="skillager.css" />
  </head>
  <body class="hvir-guest" data-view="library">
    <main>
      <h1>Your library</h1>
      <p class="hvir-meta">Your personal skills. Reading does not approve or run them.</p>
      <div class="toolbar">
        <button id="open-library" class="hvir-button">Your library</button
        ><button id="browse" class="hvir-button">Browse</button
        ><button id="refresh" class="hvir-button">Refresh</button>
        <button id="manage" class="hvir-button" disabled>Manage library</button>
      </div>
      <form id="search-form">
        <input
          id="query"
          class="hvir-input"
          type="search"
          aria-label="Skillager indexed search"
          placeholder="Search skills"
        /><button class="hvir-button" type="submit">Search</button>
        <details class="search-options">
          <summary>Search options</summary>
          <div>
            <label
              ><input id="include-installed" type="checkbox" /><span id="installed-label"
                >Include installed</span
              ></label
            ><label><input id="separate-copies" type="checkbox" /> Separate copies</label
            ><label
              >Preferred agent
              <select id="preferred-agent" class="hvir-input">
                <option value="">All agents</option>
                <option value="codex">Codex</option>
                <option value="claude">Claude</option>
              </select></label
            >
          </div>
          <p id="installed-note" class="hvir-meta"></p>
        </details>
      </form>
      <p id="state" class="hvir-state" aria-live="polite">Connecting…</p>
      <div
        id="skills"
        class="hvir-list"
        role="listbox"
        aria-label="Skill observations"
      ></div>
      <nav class="toolbar" aria-label="Skill pages">
        <button id="previous" class="hvir-button" disabled>Previous</button
        ><button id="next" class="hvir-button" disabled>Next</button>
      </nav>
      <details class="observation-details">
        <summary>Observation details</summary>
        <p id="observation-details" class="hvir-meta"></p>
      </details>
    </main>
    <script src="guest-ui.js"></script>
    <script src="skillager.js"></script>
  </body>
</html>
