name: Electron reliability partition

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      partition:
        required: true
        type: number
      attempt_start:
        required: true
        type: number
      attempt_count:
        required: true
        type: number

permissions:
  contents: read

jobs:
  partition:
    name: ${{ inputs.platform }} · invocation ${{ inputs.attempt_start }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out the fixed source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run the planned full-suite invocation
        id: invoke
        continue-on-error: true
        env:
          HVIR_QUALIFICATION_MODE: ${{ inputs.mode }}
          HVIR_QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha }}
          HVIR_QUALIFICATION_PLATFORM: ${{ inputs.platform }}
          HVIR_QUALIFICATION_PARTITION: ${{ inputs.partition }}
          HVIR_QUALIFICATION_ATTEMPT_START: ${{ inputs.attempt_start }}
          HVIR_QUALIFICATION_ATTEMPT_COUNT: ${{ inputs.attempt_count }}
          HVIR_QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          HVIR_QUALIFICATION_OUTPUT_DIR: ${{ runner.temp }}/electron-partition
        run: node scripts/run-electron-qualification.mts partition

      - name: Upload the complete or interrupted invocation record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ inputs.mode }}-${{ inputs.source_sha }}-${{ inputs.platform }}-partition-${{ inputs.partition }}
          path: ${{ runner.temp }}/electron-partition
          if-no-files-found: error
          retention-days: 30

      - name: Fail when the invocation lacks passing evidence
        if: always()
        env:
          HVIR_QUALIFICATION_OUTPUT_DIR: ${{ runner.temp }}/electron-partition
        run: node scripts/run-electron-qualification.mts assert-partition
