          assert.equal(query.streaming.completionBudgetMs, 7000);
          assert.equal(query.streaming.selectedIndex, 1);
          assert.equal(query.streaming.copiedWhileProducing, true);
          assert.equal(proof.readonlyQuery.retainedAfterExit, true);
