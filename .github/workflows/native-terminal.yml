name: Native terminal dependency

on:
  pull_request:
    branches: [main, 'epic/**']
    paths:
      - scripts/native-terminal/**
      - packages/native-terminal/**
      - src/main/terminal/native-terminal-*
      - src/workers/native-terminal-*
      - src/shared/native-terminal.ts
      - src/preload/native-terminal-probe.ts
      - electron.vite.config.ts
      - package-lock.json
      - .github/workflows/native-terminal.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: native-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native dependency (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare Linux EGL development prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libegl-dev libgl1-mesa-dri gdb xvfb
          dpkg-query -W pkg-config libegl-dev libegl1 libgl1-mesa-dri gdb
      - name: Require macOS shader compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          xcrun metal --version
          xcrun --find metallib
      - name: Build exact source and verify native loader, facade and completed frames
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/native-terminal/build.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build"
          node scripts/native-terminal/check.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build/artifact"
      - name: Install pinned Electron and build binding snapshots
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm ci
          node scripts/native-terminal/bindings.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build/artifact" "$RUNNER_TEMP/hvir-native-bindings"
          node scripts/native-terminal/resource-probe.mts packages/native-terminal/build/Release/resource-probe 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/resource-proof.jsonl"
          npx electron-vite build --mode native-terminal-probe
      - name: Prove actual utility and Electron boundary on macOS
        if: runner.os == 'macOS'
        run: |
          npx electron out/main/native-terminal-probe.js --library="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl"
      - name: Prove Linux utility and resource mechanics with explicit hardware gate
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npx electron out/main/native-terminal-probe.js --library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl"
      - name: Require the completed Electron proof receipt
        run: |
          node -e 'const fs = require("node:fs"); const assert = require("node:assert/strict"); const records = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(line => line.startsWith("{" )).map(line => JSON.parse(line)).filter(value => value.nativeUtilityBoundary === "passed"); assert.equal(records.length, 1, "completed native Electron proof receipt required"); assert.equal(records[0].hardwareGpuQualified, false); assert.equal(records[0].receiverSandboxed, true); assert.equal(records[0].receiverContextIsolated, true);' "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl"
      - name: Diagnose failed Linux library relocation
        if: failure() && runner.os == 'Linux'
        run: |
          library="$RUNNER_TEMP/hvir-native-build/install/lib/ghostty-internal.so"
          if test -f "$library"; then
            readelf --wide --dyn-syms "$library" | awk '$7 == "UND" { print $8 }'
            ldd -r "$library"
          fi
      - name: Diagnose failed Linux facade invocation
        if: failure() && runner.os == 'Linux'
        run: |
          probe="$RUNNER_TEMP/hvir-native-build/artifact/facade-probe"
          library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so"
          if test -x "$probe" && test -f "$library"; then
            timeout 130s gdb --batch --return-child-result -ex 'set pagination off' -ex run -ex 'thread apply all bt' --args "$probe" "$library" --frames > "$RUNNER_TEMP/hvir-native-build/facade-backtrace.log" 2>&1 || true
          fi
      - name: Retain native probe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-terminal-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/hvir-native-build/facade-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain binding and Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-terminal-host-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/hvir-native-bindings/*.jsonl
            packages/native-terminal/build/Release/bindings.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve modes and prove archive round trip
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "$RUNNER_TEMP/native-terminal-${TARGET}.tar.gz" -C "$RUNNER_TEMP/hvir-native-build" artifact
          mkdir "$RUNNER_TEMP/native-terminal-received"
          tar -xf "$RUNNER_TEMP/native-terminal-${TARGET}.tar.gz" -C "$RUNNER_TEMP/native-terminal-received"
          node scripts/native-terminal/check.mts "$TARGET" "$RUNNER_TEMP/native-terminal-received/artifact"
      - name: Archive binding modes and exact proof receipts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "$RUNNER_TEMP/native-terminal-bindings-${TARGET}.tar.gz" -C packages/native-terminal/build Release -C "$RUNNER_TEMP/hvir-native-bindings" resource-proof.jsonl electron-proof.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: native-terminal-bindings-${{ matrix.target }}
          path: ${{ runner.temp }}/native-terminal-bindings-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: native-terminal-${{ matrix.target }}
          path: ${{ runner.temp }}/native-terminal-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
