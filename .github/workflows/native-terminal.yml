name: Native terminal dependency

on:
  pull_request:
    branches: [main, 'epic/**']
    paths:
      - scripts/native-terminal/**
      - packages/native-terminal/**
      - src/main/terminal/native-terminal-*
      - src/main/terminal/terminal-application.ts
      - src/workers/native-terminal-*
      - src/shared/native-terminal*
      - src/shared/ui-responsiveness-budget.ts
      - src/main/worker-host.ts
      - src/preload/native-terminal-*
      - src/preload/index.ts
      - src/renderer/src/terminal/native-terminal-*.ts
      - src/renderer/src/terminal/terminal-runtime*.ts
      - src/renderer/src/terminal/terminal-pane*.ts
      - src/main/pty/pty-supervisor.ts
      - src/main/pty/pty-contract.ts
      - src/main/pty/pty-session-lifetime.ts
      - src/main/pty/pty-stream-attachment.ts
      - src/main/pty/pty-terminal-output.ts
      - src/main/project-host/project-host.ts
      - src/main/project-host/local-host.ts
      - src/main/project-host/ssh-host.ts
      - src/main/smoke/native-terminal-workbench.ts
      - src/main/ipc/features/native-terminal-runtime.ts
      - scripts/run-smoke.sh
      - src/main/ipc/features/native-terminal-presentation.ts
      - src/main/ipc/authority-router.ts
      - src/main/ipc/authority-channel-policy.ts
      - src/main/renderer-resource-scopes.ts
      - src/shared/ipc/terminal.ts
      - electron.vite.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/native-terminal.yml
      - .github/workflows/native-terminal-packages.yml
      - .github/workflows/macos-package-release.yml
      - electron-builder.yml
      - build/native/**
      - scripts/installed-*-probe.mts
      - scripts/run-*-package-smoke.sh
  workflow_dispatch:
    inputs:
      sign_candidate:
        description: Request exact candidate signing through the protected environment.
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: native-terminal-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.sign_candidate && 'signed' || 'unsigned' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.sign_candidate }}

jobs:
  build:
    name: Native dependency (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare Linux EGL development prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libegl-dev libgl1-mesa-dri gdb xvfb
          dpkg-query -W pkg-config libegl-dev libegl1 libgl1-mesa-dri gdb
          gdb --version
          if test -r /proc/sys/kernel/yama/ptrace_scope; then
            echo "Linux ptrace_scope (read-only diagnostic prerequisite):"
            cat /proc/sys/kernel/yama/ptrace_scope
          fi
      - name: Require macOS shader compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          xcrun metal --version
          xcrun --find metallib
      - name: Build exact source and verify native loader, facade and completed frames
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/native-terminal/build.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build"
          node scripts/native-terminal/check.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build/artifact"
          node - "$RUNNER_TEMP/hvir-native-build/artifact/facade-proof.json" <<'NODE'
          const assert = require('node:assert/strict');
          const proof = require(process.argv[2]);
          assert(proof.idleObservationMs >= 1200);
          assert(proof.idleCompletedFrames <= 4);
          assert(proof.idlePolls >= 100);
          assert.equal(proof.idleCpuReadback, false);
          assert.equal(proof.cursorObservationMs, 1300);
          assert(proof.cursorCompletedFrames >= 2);
          if (proof.frameKind === 1 || proof.frameKind === 3)
            assert.equal(proof.cursorPixelsChecked, true);
          NODE
      - name: Install pinned Electron and build binding snapshots
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm ci
          node scripts/native-terminal/bindings.mts "$TARGET" "$RUNNER_TEMP/hvir-native-build/artifact" "$RUNNER_TEMP/hvir-native-bindings"
          node scripts/native-terminal/resource-probe.mts packages/native-terminal/build/Release/resource-probe 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/resource-proof.jsonl"
          npx electron-vite build --mode native-terminal-probe
      - name: Prove actual utility and Electron boundary on macOS
        if: runner.os == 'macOS'
        run: |
          node scripts/native-terminal/run-electron-probe.mts --library="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl"
      - name: Prove Linux utility and resource mechanics with explicit hardware gate
        if: runner.os == 'Linux'
        run: |
          HVIR_NATIVE_TERMINAL_OZONE=x11 xvfb-run -a node scripts/native-terminal/run-electron-probe.mts --library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl"
      - name: Prove production canvas and explicit pixel compatibility
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            HVIR_NATIVE_TERMINAL_OZONE=x11 xvfb-run -a node scripts/native-terminal/run-electron-probe.mts --presenter --library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/presenter-gpu.jsonl"
            HVIR_NATIVE_TERMINAL_OZONE=x11 xvfb-run -a node scripts/native-terminal/run-electron-probe.mts --presenter --compatibility --library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/presenter-pixels.jsonl"
          else
            node scripts/native-terminal/run-electron-probe.mts --presenter --library="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/presenter-gpu.jsonl"
            node scripts/native-terminal/run-electron-probe.mts --presenter --compatibility --library="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" 2>&1 | tee "$RUNNER_TEMP/hvir-native-bindings/presenter-pixels.jsonl"
          fi
          node - "$RUNNER_TEMP/hvir-native-bindings" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const mode of ['gpu', 'pixels']) {
            const records = fs.readFileSync(`${process.argv[2]}/presenter-${mode}.jsonl`, 'utf8')
              .split('\n').filter(line => line.startsWith('{')).map(line => JSON.parse(line))
              .filter(value => value.nativePresenter === 'passed');
            assert.equal(records.length, 1);
            const proof = records[0];
            assert.equal(proof.requestedPresentation, mode === 'pixels' ? 'pixels' : 'auto');
            if (mode === 'pixels' || process.env.RUNNER_OS !== 'Linux')
              assert.equal(proof.mode, `native-${mode}`);
            else assert(['native-gpu', 'native-pixels'].includes(proof.mode));
            assert.equal(proof.receiverSandboxed, true);
            assert.equal(proof.receiverContextIsolated, true);
            assert.equal(proof.finalUtilityExit, true);
            assert.equal(proof.hardwareGpuQualified, false);
            assert.equal(proof.controlledCapacityQualified, false);
            assert.equal(proof.orientationQualified, true);
            assert.equal(proof.stack.actualOzoneBackend, 'unknown');
            assert(proof.stack.devices.length <= 16);
            if (process.env.RUNNER_OS === 'Linux') {
              assert.equal(proof.nativeRenderer.available, true);
              assert.equal(proof.stack.successfulExplicitSelection.backend, 'x11');
              assert.equal(proof.producerCompletion, 'gl-finish-before-export');
            }
            assert(proof.colorMaximumDifference <= 4);
            assert(proof.mainMaxGapMs <= 500);
            assert.equal(proof.responsivenessMaximumInclusiveMs, 500);
            for (const loop of [proof.responsiveness.main, proof.responsiveness.renderer]) {
              assert(loop.samples >= 2);
              assert(loop.p99Ms >= 0 && loop.p99Ms <= loop.maxMs && loop.maxMs <= 500);
            }
            if (proof.mode === 'native-gpu') {
              assert.equal(proof.contextLossReported, true);
              assert.equal(proof.contextLossNativeOccluded, true);
              assert.equal(proof.occludedCompletedFrames, 0);
              assert(proof.occludedFeeds >= 10);
            }
            if (proof.mode === 'native-gpu') {
              assert.equal(proof.routineGpuReadbacks, 0);
              assert.equal(proof.nativePixelFrames, 0);
            }
            else {
              assert(proof.frameCopies > 0);
              assert.equal(proof.maximumCompatibilityUploadBytes, 16 * 1024 * 1024);
              assert.equal(proof.compatibilityBoundRefused, true);
            }
          }
          NODE
      - name: Require the completed Electron proof receipt
        run: |
          node - "$RUNNER_TEMP/hvir-native-bindings/electron-proof.jsonl" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const records = fs.readFileSync(process.argv[2], 'utf8').split('\n')
            .filter(line => line.startsWith('{')).map(line => JSON.parse(line))
            .filter(value => value.nativeUtilityBoundary === 'passed');
          assert.equal(records.length, 1, 'completed native Electron proof receipt required');
          const proof = records[0];
          assert.equal(proof.hardwareGpuQualified, false);
          assert.equal(proof.receiverSandboxed, true);
          assert.equal(proof.receiverContextIsolated, true);
          if (proof.gpuImport === 'passed') {
            assert.equal(proof.appLifetimeQuarantines, 1);
            assert.equal(proof.quarantineReclaimedBeforeExit, false);
            assert.equal(proof.timeoutQuarantine, 'passed-app-lifetime-held-late-consumer-parser-retained');
            assert.equal(proof.releasedReceipts, 3);
          }
          assert(Array.isArray(proof.frames));
          for (const frame of proof.frames) {
            assert.equal(frame.readbackWorker, true);
            assert.equal(frame.cloneClosedBeforeReply, true);
          }
          assert(proof.mainBeats > 0 && proof.rendererBeats > 0);
          assert.equal(proof.responsivenessExcludesFaultPhases, true);
          assert.equal(proof.controlledCapacityQualified, false);
          assert.deepEqual(proof.responsivenessPolicy, {
            maximumInclusiveMs: 500, minimumSamplesPerLoop: 2,
          });
          assert.deepEqual(proof.responsiveness.map(value => value.phase), ['native', 'transfer']);
          for (const phase of proof.responsiveness) for (const loop of [phase.main, phase.renderer]) {
            assert(Number.isInteger(loop.samples) && loop.samples >= 2);
            assert(Number.isFinite(loop.p99Ms) && loop.p99Ms >= 0);
            assert(Number.isFinite(loop.maxMs) && loop.maxMs >= loop.p99Ms && loop.maxMs <= 500);
          }
          assert.equal(proof.mainImportMaximumInclusiveMs, 500);
          assert(Array.isArray(proof.importTimesMs));
          if (proof.gpuImport === 'passed') assert(proof.importTimesMs.length > 0);
          for (const value of proof.importTimesMs)
            assert(Number.isFinite(value) && value >= 0 && value <= 500);
          assert.equal(proof.mainImportMaxMs, Math.max(0, ...proof.importTimesMs));
          NODE
      - name: Qualify the ordinary native workbench runtime
        id: native_workbench
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Synthetic fixtures only: retain actual native primary-face INFO diagnostics.
          GHOSTTY_LOG: stderr
        run: |
          npm run build:smoke
          # Keep diagnostic stderr out of the machine-readable proof stream.
          if [[ "$RUNNER_OS" == Linux ]]; then
            HVIR_NATIVE_TERMINAL_ISOLATED_CLIPBOARD=1 HVIR_NATIVE_TERMINAL_OZONE=x11 HVIR_NATIVE_TERMINAL_LIBRARY="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so" \
              xvfb-run -a node scripts/run-smoke-scenarios.mts native-terminal-workbench \
              | tee "$RUNNER_TEMP/hvir-native-bindings/workbench-proof.jsonl"
          else
            HVIR_NATIVE_TERMINAL_LIBRARY="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" \
              node scripts/run-smoke-scenarios.mts native-terminal-workbench \
              | tee "$RUNNER_TEMP/hvir-native-bindings/workbench-proof.jsonl"
          fi
          node - "$RUNNER_TEMP/hvir-native-bindings/workbench-proof.jsonl" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const prefix = 'HVIR_NATIVE_WORKBENCH_OK ';
          const records = fs.readFileSync(process.argv[2], 'utf8').split('\n')
            .filter(line => line.startsWith(prefix)).map(line => JSON.parse(line.slice(prefix.length)));
          assert.equal(records.length, 1);
          const proof = records[0];
          const modeSelector = process.env.HVIR_CAPACITY_PERFORMANCE_GATE;
          assert(modeSelector === undefined || modeSelector === '' || modeSelector === 'controlled');
          const expectedPerformanceMode = modeSelector === 'controlled' ? 'controlled' : 'evidence';
          const performanceProof = proof.performance;
          assert(performanceProof && typeof performanceProof === 'object');
          assert(Array.isArray(performanceProof.phases));
          assert.equal(performanceProof.mode, expectedPerformanceMode);
          assert.equal(performanceProof.maximumInclusiveMs, 500);
          assert.equal(performanceProof.controlledCapacityQualified, false);
          assert.equal(proof.platform, process.env.RUNNER_OS === 'Linux' ? 'linux' : 'darwin');
          assert.equal(proof.actualWorkbench, true);
          assert.equal(proof.resizeControl, 'terminal-rail');
          if (process.env.RUNNER_OS === 'Linux')
            assert.equal(proof.stack.successfulExplicitSelection.backend, 'x11');
          assert.equal(proof.rendererSandboxed, true);
          assert.equal(proof.rendererContextIsolated, true);
          assert.equal(proof.supervisorSpawns, 1);
          for (const field of ['nativeInstanceMatched', 'parserMarker', 'retainedExitTail', 'rendererCanvas', 'nativeEncodedKeyboard'])
            assert.equal(proof[field], true);
          assert(proof.capturedAnsiRedPixels >= 500);
          assert(proof.resizeAcknowledgedByStty.rows > 0 && proof.resizeAcknowledgedByStty.columns > 0);
          assert.equal(proof.development, true);
          assert.equal(proof.hardwareQualified, false);
          const lifetime = proof.nativeLifetimes;
          for (const field of ['samePty', 'sameNativeState', 'hiddenOutput', 'realSessionsHandoff'])
            assert.equal(lifetime[field], true);
          assert.equal(lifetime.realHostQualified, false);
          assert.equal(lifetime.hiddenInputRefusals, 3);
          assert.equal(lifetime.cycles.length, 3);
          for (let index = 0; index < lifetime.cycles.length; index++) {
            const cycle = lifetime.cycles[index];
            assert.equal(cycle.cycle, index);
            assert.equal(cycle.canvases, 1);
            assert.equal(cycle.queuedReplyBytes, 0);
            assert(Number.isSafeInteger(cycle.serial) && cycle.serial > 0);
            if (index) assert(cycle.serial > lifetime.cycles[index - 1].serial);
          }
          const failure = proof.nativeFailureLifetimes;
          for (const field of ['explicitRestart', 'readonlyInstanceRetired', 'splitClosed', 'documentReplacement', 'oldOwnerRejected',
            'samePtyOnDocumentReplacement', 'rejectedRefit', 'noReplacementGrantOnRefusal',
            'mainUnavailableCanResume', 'staleFailureIgnored', 'nativeHostLoss',
            'lostReadRejected', 'explicitClose']) assert.equal(failure[field], true);
          const replacement = failure.replacement;
          assert(replacement && ['drawn', 'quarantined'].includes(replacement.outcome));
          const expected = replacement.expected, observed = replacement.observed;
          const positive = value => Number.isSafeInteger(value) && value > 0;
          const named = value => typeof value === 'string' && value.length > 0;
          for (const field of ['sessionId', 'instanceId', 'handle']) assert(named(expected[field]));
          assert(named(expected.providerId));
          assert(expected.profileId === null || named(expected.profileId));
          assert(named(expected.workspaceRoot.hostId) && named(expected.workspaceRoot.path));
          for (const field of ['pid', 'ownerId', 'previousOwnerGeneration']) assert(positive(expected[field]));
          assert.equal(observed.owner.id, expected.ownerId);
          assert(positive(observed.owner.generation) && observed.owner.generation > expected.previousOwnerGeneration);
          assert.equal(observed.retained.id, expected.sessionId);
          assert.equal(observed.retained.instanceId, expected.instanceId);
          assert.equal(observed.retained.pid, expected.pid);
          assert.equal(observed.native.handle, expected.handle);
          assert.equal(observed.native.instanceId, expected.instanceId);
          assert.deepEqual(observed.native.workspaceRoot, expected.workspaceRoot);
          assert.deepEqual(observed.retained.workspaceRoot, expected.workspaceRoot);
          assert.equal(observed.retained.providerId, expected.providerId);
          assert.equal(observed.retained.profileId, expected.profileId);
          for (const state of [observed.retained, observed.native]) {
            assert.equal(state.ownerId, observed.owner.id);
            assert.equal(state.ownerGeneration, observed.owner.generation);
          }
          for (const field of ['retiring', 'unavailable', 'inputUnavailable', 'inputClosed', 'readonly'])
            assert.equal(observed.native[field], false);
          const viewId = observed.presentation.viewId;
          assert(named(viewId));
          assert(Array.isArray(observed.dom.panes));
          const panes = observed.dom.panes.filter(pane => pane.viewId === 'native-terminal-' + viewId && pane.sessionId === expected.sessionId);
          assert.equal(panes.length, 1);
          const pane = panes[0];
          assert.equal(pane.connected, true);
          assert.equal(pane.paneUnavailable, false);
          assert.equal(pane.inputDisabled, false);
          assert.equal(replacement.preShutdownReclamationQualified, false);
          const lossFields = ['parserProgress', 'presentationRevoked', 'inputRevoked', 'unknownPhysicalReferencesRetained'];
          if (replacement.outcome === 'drawn') {
            const grant = observed.presentation.issuedGrant;
            assert(grant);
            assert.equal(grant.viewId, viewId);
            assert.equal(grant.frameCurrent, true);
            assert(positive(grant.target) && positive(grant.attachment) && positive(grant.geometrySerial));
            assert(named(grant.nativeEpoch));
            assert.equal(failure.additionalLaunches, 3);
            assert.equal(pane.canvasPresent, true);
            assert.equal(pane.surfaceUnavailable, false);
            assert(observed.presentation.drawn && [0, 1].includes(observed.presentation.drawn.screen));
            assert.equal(observed.presentation.drawn.geometrySerial, grant.geometrySerial);
            for (const field of lossFields) assert.equal(replacement[field], null);
            assert.equal(replacement.explicitRecovery, null);
          } else {
            const observations = observed.presentation.observations;
            assert.equal(observations.startedBeforeReload, true);
            assert.equal(observations.truncated, false);
            assert.equal(observations.readFailed, false);
            assert.equal(observations.mainSendIsNotReceiverDelivery, true);
            assert(positive(observations.total));
            const events = observations.currentView;
            assert(Array.isArray(events) && events.length > 0 && events.length <= 32);
            for (let index = 0; index < events.length; index++) {
              const event = events[index];
              assert.equal(event.viewId, viewId);
              assert(positive(event.sequence) && event.sequence <= observations.total);
              if (index) assert(event.sequence > events[index - 1].sequence);
              if (event.operation === 'grant' || event.operation === 'status') {
                assert.equal(event.state, 'returned');
                assert.equal(event.frameCurrent, true);
                assert(positive(event.target));
              } else {
                assert(['update', 'demand'].includes(event.operation));
                assert.equal(event.ownerId, observed.owner.id);
                assert.equal(event.ownerGeneration, observed.owner.generation);
              }
            }
            assert(!events.some(event => ['update', 'demand'].includes(event.operation) && event.state === 'rejected'));
            const grants = events.filter(event => event.operation === 'grant' && event.issued === true);
            assert(grants.length > 0);
            const grant = grants.at(-1);
            assert(events.some(event => event.operation === 'update' && event.state === 'started' && event.visible === true && event.sequence < grant.sequence));
            assert(positive(grant.attachment) && positive(grant.geometrySerial) && named(grant.nativeEpoch));
            assert(events.filter(event => event.operation === 'grant' || event.operation === 'status').every(event => event.target === grant.target));
            assert(events.some(event => event.operation === 'update' && event.state === 'fulfilled' && event.visible === true && event.sequence > grant.sequence));
            assert.equal(failure.additionalLaunches, 4);
            assert.equal(pane.canvasPresent, false);
            assert.equal(pane.surfaceUnavailable, true);
            assert.equal(observed.presentation.drawn, null);
            const status = events.at(-1);
            assert.equal(status.operation, 'status');
            assert.equal(status.mode, 'unavailable');
            assert.equal(status.reason, 'import-unavailable');
            const update = events.find(event => event.operation === 'update' && event.state === 'fulfilled' && event.visible === true && event.sequence > grant.sequence);
            assert(status.sequence > update.sequence);
            assert(events.some(event => event.operation === 'grant' && event.issued === false && event.sequence > update.sequence && event.sequence < status.sequence));
            for (const event of events.filter(event => event.operation === 'status' && event.mode === 'unavailable'))
              assert.equal(event.reason, 'import-unavailable');
            for (const field of lossFields) assert.equal(replacement[field], true);
            const recovery = replacement.explicitRecovery;
            assert(recovery);
            for (const field of ['uiClose', 'uiNew', 'rootMatched', 'providerOwned']) assert.equal(recovery[field], true);
            assert.equal(recovery.newActors, 1);
            assert.equal(recovery.original.id, expected.sessionId);
            assert.equal(recovery.original.instanceId, expected.instanceId);
            assert.equal(recovery.original.pid, expected.pid);
            for (const actor of [recovery.original, recovery.actor]) {
              assert(named(actor.id) && named(actor.instanceId) && positive(actor.pid));
              assert.equal(actor.providerId, expected.providerId);
              assert.equal(actor.profileId, expected.profileId);
              assert.deepEqual(actor.workspaceRoot, expected.workspaceRoot);
            }
            for (const field of ['id', 'instanceId', 'pid']) assert.notEqual(recovery.actor[field], recovery.original[field]);
          }
          assert.equal(failure.explicitRecoveryDecision, true);
          assert.deepEqual(failure.pendingNativeInputLoss, {sent: true, rejected: true, observedEpoch: true});
          assert.equal(failure.silentRelaunches, 0);
          assert.equal(typeof failure.contextLoss.eligible, 'boolean');
          assert.equal(failure.contextLoss.parserPreserved, failure.contextLoss.eligible);
          assert.deepEqual(failure.final, {livePtys: 0, nativeSessionPresent: false, canvases: 0});
          assert.equal(failure.realHostQualified, false);
          assert.equal(failure.hardwareQualified, false);
          const ssh = proof.nativeSshLifetimes;
          for (const field of ['ordinaryTerminalUi', 'realSsh2Transport', 'realNativeParser',
            'syntheticFilesystemMetadata', 'syntheticRemoteProgram', 'sameNamedHostPathsIsolated',
            'hiddenOutputAndReply', 'ordinaryWorkspaceNavigation', 'ordinarySessionsHandoff',
            'controlReconnectRetainedPty', 'terminalDisconnectRetainedParser', 'explicitUiClose', 'returnedInputLease'])
            assert.equal(ssh[field], true);
          for (const field of ['externalSshHostQualified', 'remoteOsPtyQualified', 'sharedNativeHostLossQualified'])
            assert.equal(ssh[field], false);
          assert.equal(ssh.inputBytes, 43);
          assert.equal(ssh.replyBytes, 4);
          assert.equal(ssh.inputAndReplySha256, require('node:crypto').createHash('sha256').update('hvir-m13-ssh-input\x1b[0nhvir-m13-ssh-return-input').digest('hex'));
          assert.equal(ssh.terminalStarts, 1);
          for (const field of ['remainingConnections', 'remainingChannels', 'remainingHostTransports'])
            assert.equal(ssh[field], 0);
          const effects = proof.nativeEffects;
          assert.equal(effects.phases, 10);
          for (const field of ['causalEventSerials', 'titleProductDelivery', 'remoteCwdCopied', 'readQueriesRefused', 'newClipboardProtocolsRefused', 'queriesExact', 'linkUserIntentPortHostCorrect'])
            assert.equal(effects[field], true);
          assert(Number.isSafeInteger(effects.semanticObservations) && effects.semanticObservations >= 3);
          assert.equal(effects.semanticOccurrenceIdentityQualified, false);
          assert.equal(effects.linkGestureQualified, false);
          assert.equal(effects.hardwareQualified, false);
          assert.equal(effects.nativeOsActionsQualified, false);
          assert.equal(effects.osc777AndProgressDisposition, 'ignored');
          assert.equal(effects.quietAttentionEvents, 2);
          const crypto = require('node:crypto');
          const query = proof.nativeQuery;
          assert.equal(query.actualNative, true);
          assert.equal(query.matches, 3);
          for (const [copy, text] of [[query.exactCopy, 'hvir-native-query-match'], [query.semanticCopy, 'output\n']]) {
            assert.equal(copy.bytes, Buffer.byteLength(text));
