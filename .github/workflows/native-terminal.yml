          assert.equal(proof.readonlyQuery.exactCopy.bytes, Buffer.byteLength('HVIR_READONLY_SELECTION'));
          assert.equal(proof.readonlyQuery.exactCopy.sha256, crypto.createHash('sha256').update('HVIR_READONLY_SELECTION').digest('hex'));
          assert(proof.readonlyQuery.frames >= 2 && Number.isFinite(proof.readonlyQuery.maximumFrameGapMs) && proof.readonlyQuery.maximumFrameGapMs >= 0);
          const appearance = proof.nativeAppearance;
