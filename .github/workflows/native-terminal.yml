          assert.equal(pendingPress.exactSelectedBytes, 5);
          assert.equal(pendingPress.exactSelectedSha256, crypto.createHash('sha256').update('alpha').digest('hex'));
          const largeCopy = selection.largeCopy;
          assert.equal(largeCopy.fixtureBytes, 4096 * (selection.fixtureColumns + 1) - 1);
          assert(largeCopy.fixtureBytes > 65536);
          assert.equal(Number(largeCopy.copyFinished) + Number(largeCopy.copyStale), 1);
          assert.equal(largeCopy.refusalCode, largeCopy.copyStale ? 6 : null);
          assert.equal(largeCopy.userWrites, 1);
          assert(Number.isSafeInteger(largeCopy.mutation) && largeCopy.mutation > 0);
          assert(largeCopy.copyStale || largeCopy.inputWhilePending || largeCopy.writeWhilePending);
          for (const [samples, maximum] of [[selection.mainSamples,selection.mainMaxMs],
