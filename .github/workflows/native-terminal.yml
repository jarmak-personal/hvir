            assert(Number.isSafeInteger(samples) && samples >= 2);
            assert(Number.isFinite(maximum) && maximum >= 0);
          }
          const isolatedClipboard = process.env.RUNNER_OS === 'Linux';
          assert.equal(selection.isolatedOsClipboardReadback, isolatedClipboard);
          assert.equal(selection.clipboardIntercepted, !isolatedClipboard);
          const readonlySelection = proof.readonlySelection;
          assert(Number.isSafeInteger(readonlySelection.rendererSamples) && readonlySelection.rendererSamples >= 2);
          assert(Number.isFinite(readonlySelection.rendererMaxMs) && readonlySelection.rendererMaxMs >= 0);
          const gestureBlur = readonlySelection.gestureBlur;
          assert(Number.isSafeInteger(gestureBlur.pointerId) && gestureBlur.pointerId >= 0);
          for (const field of ['acknowledgedDrag', 'tabChangedFocus', 'nativeFocusCleanup',
            'captureReleased', 'selectedRangePreserved']) assert.equal(gestureBlur[field], true);
          assert.equal(gestureBlur.heldMoveButtons, 1);
          assert.equal(gestureBlur.ptyWrites, 0);
          assert.equal(gestureBlur.ptyCount, 0);
          assert.equal(readonlySelection.readonlyDrag, true);
          assert.equal(readonlySelection.readonlyCopy, true);
          assert.equal(readonlySelection.bytes, Buffer.byteLength('HVIR_READONLY_SELECTION'));
          assert.equal(readonlySelection.sha256,
            crypto.createHash('sha256').update('HVIR_READONLY_SELECTION').digest('hex'));
          assert.equal(readonlySelection.isolatedOsClipboardReadback, isolatedClipboard);
          // Hosted workbench timing is evidence; controlled runs enforce the SAME 500 ms.
          // Keep standalone native boundary/import/presenter quantitative gates unchanged.
          const pasteCases = proof.largePaste.cases;
          assert.deepEqual(pasteCases.map(item => item.name), ['unicode', 'lnm']);
          const renderer = (samples, minimumSamples, maximumMs) => ({loop:'renderer', samples, minimumSamples, maximumMs});
          const main = (samples, minimumSamples, maximumMs) => ({loop:'main', samples, minimumSamples, maximumMs});
          const measuredPhases = [
            ['query', [renderer(query.frames, 2, query.maximumFrameGapMs)]],
            ['effects', [main(effects.responsiveness.main.samples, 2, effects.responsiveness.main.maxMs),
              renderer(effects.responsiveness.renderer.samples, 2, effects.responsiveness.renderer.maxMs)]],
            ['selection', [main(selection.mainSamples, 1, selection.mainMaxMs),
              renderer(selection.rendererSamples, 1, selection.rendererMaxMs)]],
            ...pasteCases.map(item => ['paste-' + item.name, [renderer(item.paint.frames, 1, item.paint.maxGapMs)]]),
            ['readonly-selection', [renderer(readonlySelection.rendererSamples, 2, readonlySelection.rendererMaxMs)]],
            ['readonly-query', [renderer(proof.readonlyQuery.frames, 2, proof.readonlyQuery.maximumFrameGapMs)]],
          ];
          assert.equal(performanceProof.phases.length, measuredPhases.length);
          for (const [index, [phase, loops]] of measuredPhases.entries()) {
            for (const loop of loops) {
              assert(Number.isSafeInteger(loop.samples) && loop.samples >= loop.minimumSamples);
              assert(Number.isFinite(loop.maximumMs) && loop.maximumMs >= 0);
            }
            const reported = performanceProof.phases[index];
            assert.equal(reported.phase, phase);
            assert.equal(reported.mode, expectedPerformanceMode);
            assert.equal(reported.maximumInclusiveMs, 500);
            assert.deepEqual(reported.loops, loops);
            const violations = loops.filter(loop => loop.maximumMs > 500)
              .map(loop => ({loop:loop.loop, actualMs:loop.maximumMs, maximumInclusiveMs:500}));
            assert.deepEqual(reported.violations, violations);
            if (expectedPerformanceMode === 'controlled') assert.equal(violations.length, 0);
          }
          NODE
      - name: Diagnose failed Linux library relocation
        if: failure() && runner.os == 'Linux'
        run: |
          library="$RUNNER_TEMP/hvir-native-build/install/lib/ghostty-internal.so"
          if test -f "$library"; then
            readelf --wide --dyn-syms "$library" | awk '$7 == "UND" { print $8 }'
            ldd -r "$library"
          fi
      - name: Diagnose failed Linux facade invocation
        if: failure() && runner.os == 'Linux'
        run: |
          probe="$RUNNER_TEMP/hvir-native-build/artifact/facade-probe"
          library="$RUNNER_TEMP/hvir-native-build/artifact/ghostty-internal.so"
          if test -x "$probe" && test -f "$library"; then
            timeout 130s gdb --batch --return-child-result -ex 'set pagination off' -ex run -ex 'thread apply all bt' --args "$probe" "$library" --frames > "$RUNNER_TEMP/hvir-native-build/facade-backtrace.log" 2>&1 || true
          fi
      - name: Retain native probe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-terminal-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/hvir-native-build/facade-*.log
          if-no-files-found: ignore
          retention-days: 7
      # This additional run diagnoses an already-failed unprofiled qualification.
      # Its outcome never replaces the original responsiveness acceptance result.
      - name: Trace a failed macOS native workbench qualification
        if: failure() && runner.os == 'macOS' && steps.native_workbench.outcome == 'failure'
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p "$RUNNER_TEMP/hvir-native-trace"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'hvir-native-trace');
          fs.writeFileSync(path.join(directory, 'trace-config.json'), JSON.stringify({
            startup_duration: 180,
            result_file: path.join(directory, 'compositor.pftrace'),
            trace_config: {
              record_mode: 'record-continuously',
              trace_buffer_size_in_kb: 65536,
              included_categories: [
                'toplevel', 'input', 'cc', 'viz', 'gpu', 'renderer.scheduler',
                'sequence_manager', 'devtools.timeline', 'blink.user_timing',
                'disabled-by-default-devtools.timeline',
                'disabled-by-default-cc.debug.scheduler',
              ],
              excluded_categories: ['*'],
            },
          }, null, 2));
          NODE
          # Ring buffer is bounded; shutdown flush is not periodic file flushing.
          # Check trace coverage/loss before drawing conclusions from a captured gap.
          git rev-parse HEAD > "$RUNNER_TEMP/hvir-native-trace/source-commit.txt"
          shasum -a 256 "$RUNNER_TEMP/hvir-native-trace/trace-config.json" \
            packages/native-terminal/build/Release/bindings.json \
            "$RUNNER_TEMP/hvir-native-build/artifact/manifest.json" \
            > "$RUNNER_TEMP/hvir-native-trace/identities.sha256"
          HVIR_NATIVE_TERMINAL_TRACE_CONFIG="$RUNNER_TEMP/hvir-native-trace/trace-config.json" \
            HVIR_NATIVE_TERMINAL_LIBRARY="$RUNNER_TEMP/hvir-native-build/artifact/libghostty.dylib" \
            node scripts/run-smoke-scenarios.mts native-terminal-workbench \
            > "$RUNNER_TEMP/hvir-native-trace/profiled.stdout.log" \
            2> "$RUNNER_TEMP/hvir-native-trace/profiled.stderr.log"
      - name: Retain macOS compositor diagnostic trace
        if: always() && runner.os == 'macOS' && steps.native_workbench.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: native-terminal-compositor-trace-${{ matrix.target }}
          path: ${{ runner.temp }}/hvir-native-trace/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain binding and Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-terminal-host-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/hvir-native-bindings/*.jsonl
            ${{ runner.temp }}/hvir-native-build/artifact/font-cases-proof.json
            packages/native-terminal/build/Release/bindings.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve modes and prove archive round trip
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "$RUNNER_TEMP/native-terminal-${TARGET}.tar.gz" -C "$RUNNER_TEMP/hvir-native-build" artifact
          mkdir "$RUNNER_TEMP/native-terminal-received"
          tar -xf "$RUNNER_TEMP/native-terminal-${TARGET}.tar.gz" -C "$RUNNER_TEMP/native-terminal-received"
          node scripts/native-terminal/check.mts "$TARGET" "$RUNNER_TEMP/native-terminal-received/artifact"
      - name: Archive binding modes and exact proof receipts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          proofs=(resource-proof.jsonl electron-proof.jsonl workbench-proof.jsonl)
          if [[ "$RUNNER_OS" == macOS ]]; then
            proofs+=(presenter-gpu.jsonl presenter-pixels.jsonl)
          fi
          tar -czf "$RUNNER_TEMP/native-terminal-bindings-${TARGET}.tar.gz" -C packages/native-terminal/build Release -C "$RUNNER_TEMP/hvir-native-bindings" "${proofs[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-terminal-bindings-${{ matrix.target }}
          path: ${{ runner.temp }}/native-terminal-bindings-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: native-terminal-${{ matrix.target }}
          path: ${{ runner.temp }}/native-terminal-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  agent-clients:
    name: Exact candidate agent clients
    uses: ./.github/workflows/agent-clients.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  packages:
    name: Exact native candidate package acceptance
    needs: [build, agent-clients]
    uses: ./.github/workflows/native-terminal-packages.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      sign_candidate: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_candidate || false }}
    secrets: inherit
