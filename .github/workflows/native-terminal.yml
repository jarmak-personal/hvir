            'parserInputAlive', 'drag', 'word', 'line', 'unicodeWhitespace', 'softwrap', 'selectAll', 'menu',
            'metaCopy', 'controlShiftCopy', 'fileUriAndPlainIntent', 'linkRootsMatched', 'loopbackRouteContent',
            'externalOpenerObserved']) assert.equal(selection[field], true);
          assert.equal(selection.osExternalOpenerInvoked, false);
          assert.equal(selection.hardwareGpuQualified, false);
          assert.equal(selection.retentionEpoch, 'HVIR_M9_RETENTION_EPOCH');
          assert(Number.isSafeInteger(selection.fixtureColumns) && selection.fixtureColumns >= 40);
          assert(Number.isSafeInteger(selection.linkIntents) && selection.linkIntents >= 4);
          assert.deepEqual(selection.copies.map(copy => copy.name),
            ['drag', 'word', 'line', 'unicode-whitespace', 'all-softwrap', 'continuous-drag']);
          for (const copy of selection.copies) {
            assert(Number.isSafeInteger(copy.bytes) && copy.bytes > 0);
            assert(/^[a-f0-9]{64}$/.test(copy.sha256));
            const fixed = {drag:'alpha', word:'alpha', line:'alpha beta',
              'unicode-whitespace':'  A界e\u0301B  ', 'continuous-drag':'alpha'}[copy.name];
            if (fixed !== undefined) {
              assert.equal(copy.bytes, Buffer.byteLength(fixed));
              assert.equal(copy.sha256, crypto.createHash('sha256').update(fixed).digest('hex'));
            } else assert(copy.bytes > selection.fixtureColumns);
          }
          assert(selection.continuous.producedBytes >= 65536);
          assert.equal(selection.continuous.copiedWhileActive, true);
          const pendingPress = selection.pendingPressAck;
