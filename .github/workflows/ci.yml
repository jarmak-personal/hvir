name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'epic/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-version-integrity:
    name: Release version integrity
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'github-actions[bot]' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out trusted release validation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/validate-release-pr.mts
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate version-only release change
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR_MODE: pre-merge
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-release-pr.mts

  verify:
    name: Verification (Linux)
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The architecture ratchet compares against its named baseline commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run policy, type, and test verification
        run: npm run verify

  electron-smoke:
    name: Electron smoke (Linux)
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run production Electron workflow
        env:
          HVIR_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/hvir-smoke-artifacts/production
        run: xvfb-run -a npm run smoke

      - name: Run development renderer Performance Timeline containment
        env:
          HVIR_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/hvir-smoke-artifacts/development-performance
        run: xvfb-run -a npm run smoke:development-performance

      - name: Prove failure and interruption isolation
        run: xvfb-run -a npm run smoke:isolation

      - name: Upload bounded Electron failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-electron-smoke-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvir-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  capacity-smoke:
    name: Capacity contracts + performance evidence (Linux)
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run capacity contracts and collect performance evidence
        env:
          HVIR_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/hvir-smoke-artifacts/capacity
        run: xvfb-run -a npm run smoke:capacity

      - name: Upload bounded capacity failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-capacity-smoke-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvir-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  macos-electron-smoke:
    # Temporary reduced gate: terminal-presentation, terminal-lifecycle, and capacity
    # remain available through local commands while their macOS flakes are hardened.
    name: Electron correctness (macOS arm64; temporary reduced gate)
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run focused unpackaged Electron scenarios
        env:
          HVIR_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/hvir-smoke-artifacts/macos-ci
        run: npm run smoke:macos:ci

      - name: Upload bounded macOS Electron failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-macos-electron-smoke-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hvir-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  native-linux-package:
    name: Native package acceptance (${{ matrix.name }})
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            build: npm run pack:linux:x64
            artifact: dist/hvir_*_amd64.deb
          - name: Linux arm64
            os: ubuntu-24.04-arm
            build: npm run pack:linux:arm64
            artifact: dist/hvir_*_arm64.deb
    env:
      HVIR_LINUX_PACKAGE_ACCEPTANCE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build native package
        run: ${{ matrix.build }}

      - name: Install, update, launch, and remove native package
        run: xvfb-run -a npm run smoke:linux:installed

      - name: Retain accepted native package
        uses: actions/upload-artifact@v7
        with:
          name: hvir-${{ matrix.name }}-deb
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native-macos-package:
    name: Native package acceptance (macOS arm64, unsigned structure)
    needs: release-version-integrity
    if: always() && needs.release-version-integrity.result == 'skipped'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HVIR_MACOS_PACKAGE_ACCEPTANCE: '1'
      HVIR_MACOS_PACKAGE_MODE: structural

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned structural package
        run: npm run pack:mac:arm64

      - name: Install, update, launch, and remove structural package
        run: npm run smoke:macos:installed

      - name: Upload structural package
        uses: actions/upload-artifact@v7
        with:
          name: hvir-macos-arm64-unsigned-structure
          path: dist/hvir-*-macos-arm64.pkg
          if-no-files-found: error
          retention-days: 1

  native-release-assembly:
    name: Native release assembly (unsigned structure)
    needs:
      - native-linux-package
      - native-macos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download accepted Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: hvir-*-deb
          path: dist/release
          merge-multiple: true

      - name: Download accepted macOS package structure
        uses: actions/download-artifact@v8
        with:
          name: hvir-macos-arm64-unsigned-structure
          path: dist/release

      - name: Assemble and verify the cumulative release contract
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          mv -- \
            "dist/release/hvir_${version}_amd64.deb" \
            "dist/release/hvir-${version}-linux-x64.deb"
          mv -- \
            "dist/release/hvir_${version}_arm64.deb" \
            "dist/release/hvir-${version}-linux-arm64.deb"
          mv -- \
            "dist/release/hvir-${version}-macos-arm64.pkg" \
            "dist/release/hvir-${version}-darwin-arm64.pkg"
          npm run assemble:native-release -- \
            --version "$version" \
            --source-sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --macos-team-id AAAAAAAAAA \
            --asset-directory dist/release
          bash -n dist/release/install.sh
          (
            cd dist/release
            sha256sum --check SHA256SUMS
          )

  # One-time bootstrap for epic #222. Remove this invocation after the epic merges;
  # default-branch releases continue to call the same protected reusable workflow.
  signed-macos-epic-acceptance:
    name: Signed native package acceptance (epic #222)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 234 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'epic/222-native-distribution' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/macos-package-release.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      source_branch: epic/222-native-distribution
      allow_pull_request_signing: true
    secrets: inherit
