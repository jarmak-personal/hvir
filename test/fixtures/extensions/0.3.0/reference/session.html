<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reference session</title>
    <link rel="stylesheet" href="presentation.css" />
    <link rel="stylesheet" href="reference.css" />
    <script defer src="guest-ui.js"></script>
    <script defer src="reference.js"></script>
  </head>
  <body class="hvir-guest">
    <main class="hvir-content hvir-stack">
      <h1>Session observation</h1>
      <p id="session-title">Waiting for admitted context</p>
      <button
        class="hvir-button hvir-focus"
        data-variant="regular"
        id="mark-session"
        type="button"
      >
        Mark this session
      </button>
      <p id="status" class="hvir-state" data-state="loading" role="status">
        Connecting to hvir…
      </p>
      <p id="observation"></p>
    </main>
  </body>
</html>
